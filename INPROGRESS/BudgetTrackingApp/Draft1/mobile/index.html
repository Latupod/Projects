<!DOCTYPE html>
<!--
  index.html — App shell (always visible)

  Role: Fixed layout with header, main content area, and bottom nav.
        Page content is loaded dynamically into #app-content by app.js navigateTo().
        data-page on nav links must match keys in app.js PAGE_FILES.

  Entry: static/js/app.js (ES module) starts the app on load.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">

  <title>Budget Tracker</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="static/icons/icon.svg">

  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/mobile.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title" id="page-title">Dashboard</h1>
  </header>

  <!-- app.js injects pages/*.html here; ids below are targets for JS -->
  <main class="app-main" id="app-content" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- data-page values map to app.js routes (#dashboard, #add, …) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#dashboard" class="bottom-nav__link bottom-nav__link--active" data-page="dashboard">
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="#add" class="bottom-nav__link" data-page="add">
      <span class="bottom-nav__label">Add</span>
    </a>
    <a href="#history" class="bottom-nav__link" data-page="history">
      <span class="bottom-nav__label">History</span>
    </a>
    <a href="#budgets" class="bottom-nav__link" data-page="budgets">
      <span class="bottom-nav__label">Budgets</span>
    </a>
    <a href="#settings" class="bottom-nav__link" data-page="settings">
      <span class="bottom-nav__label">Settings</span>
    </a>
  </nav>

  <script type="module" src="static/js/app.js"></script>
</body>
</html>
