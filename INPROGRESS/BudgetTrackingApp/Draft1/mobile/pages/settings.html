<!--
  pages/settings.html — Export/import backup fragment

  Loaded by app.js → initSettingsPage()
  Buttons call export.js: exportJsonFile, exportCsvFile, importJsonFile
-->
<section class="page page--settings">
  <section class="card">
    <h2 class="card__title">Data backup</h2>
    <p class="hint">Export your data to move it to your laptop or restore on a new phone.</p>

    <div class="button-row">
      <button class="btn btn--primary" type="button" id="export-json-btn">Export JSON</button>
      <button class="btn btn--secondary" type="button" id="export-csv-btn">Export CSV</button>
    </div>
  </section>

  <section class="card">
    <h2 class="card__title">Import backup</h2>
    <label class="form__field">
      <span class="form__label">Choose a JSON backup file</span>
      <input class="form__input" type="file" id="import-file" accept="application/json,.json">
    </label>
    <button class="btn btn--secondary" type="button" id="import-btn">Import</button>
  </section>
</section>
