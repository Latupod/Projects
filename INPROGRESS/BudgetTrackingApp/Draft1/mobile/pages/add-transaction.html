<!--
  pages/add-transaction.html — Add expense/income form fragment

  Loaded by app.js → initAddPage() → ui/transaction-form.js bindTransactionForm()
  Form field names (amount, type, category_id, date, note) map to createTransaction() input.
-->
<section class="page page--add">
  <form class="form" id="transaction-form">
    <fieldset class="segmented" aria-label="Transaction type">
      <label class="segmented__option">
        <input type="radio" name="type" value="expense" checked>
        <span>Expense</span>
      </label>
      <label class="segmented__option">
        <input type="radio" name="type" value="income">
        <span>Income</span>
      </label>
    </fieldset>

    <label class="form__field">
      <span class="form__label">Amount</span>
      <input class="form__input" type="number" name="amount" min="0" step="0.01" required placeholder="0.00">
    </label>

    <label class="form__field">
      <span class="form__label">Category</span>
      <select class="form__input" name="category_id" id="category-select" required>
        <!-- Filled by ui/transaction-form.js populateCategorySelect() -->
      </select>
    </label>

    <label class="form__field">
      <span class="form__label">Date</span>
      <input class="form__input" type="date" name="date" required>
    </label>

    <label class="form__field">
      <span class="form__label">Note</span>
      <input class="form__input" type="text" name="note" maxlength="200" placeholder="Optional">
    </label>

    <button class="btn btn--primary" type="submit">Save transaction</button>
  </form>
</section>
